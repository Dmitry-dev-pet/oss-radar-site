name: October trending full historical API verification

on:
  pull_request:
    paths:
      - '.github/workflows/october-trending-api-verify.yml'

permissions:
  contents: read

jobs:
  fetch-missing-dates:
    if: github.repository == 'Dmitry-dev-pet/oss-radar-site' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query public GitStock archive for ALL 31 days of October 2026
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, time, urllib.request, urllib.parse, urllib.error
          from datetime import date,datetime,timezone,timedelta
          root=pathlib.Path("october-2026-backfill")
          root.mkdir(exist_ok=True)
          dates=[(date(2026,10,1)+timedelta(days=i)).isoformat() for i in range(31)]
          results=[]
          for day in dates:
              url="https://gitstock.org/api/v1/github/trending?"+urllib.parse.urlencode({"period":"daily","date":day})
              status={"date":day,"provider":"GitStock","url":url}
              try:
                  req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"OSS-Radar-Archive-Verification/1.0"})
                  with urllib.request.urlopen(req,timeout=18) as resp:
                      raw=resp.read(300000)
                      status["http"]=resp.status
                  data=json.loads(raw)
                  if isinstance(data,dict) and not isinstance(data.get("items"),list):
                      print("API_UNEXPECTED "+json.dumps({"day":day,"keys":list(data),"body_preview":str(data)[:150]},ensure_ascii=False))
                  if not isinstance(data,dict) or not isinstance(data.get("items"),list):
                      raise ValueError("invalid GitStock item list")
                  if data.get("date")!=day or data.get("period")!="daily":
                      raise ValueError("date or period mismatch")
                  rows=[]
                  for row in data["items"]:
                      if not isinstance(row,dict) or not isinstance(row.get("owner"),str) or not isinstance(row.get("repo"),str):
                          raise ValueError("invalid repo row")
                      name=row["owner"]+"/"+row["repo"]
                      rows.append({"rank":row.get("rank"),"repo":name,"stars":row.get("stars"),"stars_gained":row.get("stars_gained"),"captured_at":row.get("captured_at"),"language":row.get("language"),"description":row.get("description"),"github_url":row.get("github_url")})
                  if not rows:raise ValueError("empty daily list")
                  final={"date":day,"provider":"GitStock","source_url":url,"source_timezone":data.get("timezone"),"period":"daily","count":len(rows),"rows":rows}
                  (root/(day+".json")).write_text(json.dumps(final,ensure_ascii=False,indent=2)+"\n")
                  status["state"]="verified";status["count"]=len(rows)
                  print("BACKFILL_ENTRY "+json.dumps(final,ensure_ascii=False,separators=(",",":")),flush=True)
              except Exception as e:
                  status["state"]="unavailable";status["error_type"]=type(e).__name__;status["detail"]=str(e)[:150]
                  print("BACKFILL_ERROR "+json.dumps(status,ensure_ascii=False),flush=True)
              results.append(status)
              time.sleep(0.5)
          result={"created_at":datetime.now(timezone.utc).isoformat(),"requested_dates":dates,"results":results}
          (root/"manifest.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n")
          print("BACKFILL_SUMMARY "+json.dumps({"verified":sum(x["state"]=="verified" for x in results),"missing":len(results)-sum(x["state"]=="verified" for x in results),"counts":{x["date"]:x.get("count") for x in results}},ensure_ascii=False),flush=True)
          if any(x["state"]!="verified" for x in results):
              raise SystemExit(1)
          PY
      - name: Preserve dated API results as temporary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: october-2026-full-api-verification
          path: october-2026-backfill/*.json
          if-no-files-found: warn
          retention-days: 7
