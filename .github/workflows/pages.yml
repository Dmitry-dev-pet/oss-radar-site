name: Publish OSS Radar editorial reviews

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'reviews/**'
      - 'style.css'
      - 'tests/test_editorial_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'Dmitry-dev-pet/oss-radar-site' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest # public repo; no private Actions minutes
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate editorial source and package review pages only
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s style.css
          test -s reviews/2026-11-08.html
          python3 -m unittest discover -s tests -p 'test_editorial_site.py' -v
          mkdir -p _site/reviews
          cp index.html style.css _site/
          cp reviews/*.html _site/reviews/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/reviews/2026-11-08.html
          ! test -e _site/trends.html
          ! test -e _site/october.html
          ! test -e _site/app.js
          ! test -e _site/data
          echo "Packaged editorial-only Pages: no catalog, no trends UI, no scheduled importer."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
