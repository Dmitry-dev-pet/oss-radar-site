name: Publish OSS Radar editorial reviews

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'review-catalog.js'
      - 'reviews/catalog.json'
      - 'reviews/**'
      - 'style.css'
      - 'tests/test_editorial_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'Dmitry-dev-pet/oss-radar-site' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest # public repo; no private Actions minutes
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate editorial source and package review pages only
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s review-catalog.js
          test -s reviews/catalog.json
          node --check review-catalog.js
          test -s style.css
          test -s reviews/2026-09-28-10-04.html
          python3 -m unittest discover -s tests -p 'test_editorial_site.py' -v
          mkdir -p _site/reviews
          cp index.html style.css review-catalog.js _site/
          cp reviews/catalog.json _site/reviews/
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          catalog = json.loads(Path("reviews/catalog.json").read_text(encoding="utf-8"))
          for item in catalog["articles"]:
              source = Path(item["url"])
              assert source.parent == Path("reviews") and source.suffix == ".html"
              assert source.is_file()
              shutil.copy2(source, Path("_site") / source)
          shutil.copy2("reviews/2026-10-01-04.html", "_site/reviews/2026-10-01-04.html")
          PY
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/reviews/2026-09-28-10-04.html
          ! test -e _site/reviews/2026-11-08.html
          ! test -e _site/reviews/2026-10-26-31.html
          test -s _site/reviews/catalog.json
          test -s _site/review-catalog.js
          ! test -e _site/trends.html
          ! test -e _site/october.html
          ! test -e _site/app.js
          ! test -e _site/data
          echo "Packaged editorial review catalog: no repository catalog, no trends UI, no scheduled importer."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
